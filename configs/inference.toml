# =============================================================================
# Inference and web demo (python whistle.py infer | generate | serve | export-web | model-status)
#
# Not part of training or preprocessing: nothing here changes a training or processing hash.
# Uploads go through S2-S9 exactly as configured in configs/pipeline.toml (the training data's settings).
# Tags as elsewhere: [DECISION] = chosen here; the paper does not cover a demo.
# =============================================================================

[model]
# The trained files are read from the paths the training commands write (models/vaegmm/<run_id>/...):
#   checkpoints/<checkpoint>                     python whistle.py train-vae --experiment V1
#   gmm_K<n_components>[_<gmm_tag>]/gmm.npz      python whistle.py fit-gmm --experiment V1   (+ gmm.json beside it)
#   gmm_K<n_components>/component_features.npy   python whistle.py vae-eval components --experiment V1   (conditional generation only)
run_id       = "V1_L64_b1e-4_critic_E191"   # main model of the paper (L = 64, beta = 1e-4, with critic), trained on encounter 191
checkpoint   = "last.pt"               # [DECISION] newest finished epoch (train.py writes it every epoch; identical to final.pt once
                                       # training ends, or once post_training/finalize_run.py closes a run stopped early).
                                       # A mid-training checkpoint is reported as such (status vae.in_training); a finalised
                                       # early stop as vae.stopped_early (V1: epoch 101 of 150)
n_components = 3000                    # [DEVIATION] main K for encounter 191 (configs/vaegmm.toml [deviations]; paper K = 10,000)
gmm_tag      = ""
device       = "auto"                  # auto | cpu | cuda (detector and model)

# The models a visitor can choose between in Try it (the page's model selector); the first is the default, and every one
# is loaded when the server starts. Each entry is [model] above with the entry's own keys replaced, so an entry with only
# id and name is exactly [model].
#   id    the stable name the page and the API use (letters, digits, _ or -); keep it when renaming
#   name  what the page shows; rename freely, then restart the server
[[models]]
id   = "model1"
name = "Nyx"                           # epoch 101 of 150: [model] as it is (the paper results and WhistleCode use this one)

[[models]]
id         = "model2"
name       = "Delphi"                  # epoch 150 of 150: the run resumed on a Colab A100 on 2026-11-20 (Drive final.pt,
run_id     = "V1_L64_b1e-4_critic_E191_epoch150"   # SHA-256 1db44d81...), in its own folder so model1 stays as it is
checkpoint = "final.pt"
# Its own Gaussian mixture (K = 3,000, fitted 2026-11-20 on its own latents; post_training/gmm_check.py --run-id ... PASSED)
# and component features were made with
#   python whistle.py fit-gmm --experiment V1_L64_b1e-4_critic_E191_epoch150
#   python whistle.py vae-eval components --experiment V1_L64_b1e-4_critic_E191_epoch150

[input]
formats            = [".wav", ".flac", ".ogg", ".mp3"]   # whatever libsndfile reads
min_sample_rate_hz = 32000      # [DECISION] below this the detector band (2-24 kHz) is mostly empty
max_sample_rate_hz = 768000     # [DECISION] above the raw recordings' 500 kHz; with max_duration_s it bounds the memory one upload needs
max_channels       = 8          # [DECISION] the raw recordings have 6; only the chosen channel is kept (guard.read_channel)
full_band_rate_hz  = 48000      # [DECISION] at or above this the whole detector band is present; below it a warning is given
min_duration_s     = 0.25       # [DECISION]
max_duration_s     = 120.0      # [DECISION] keeps one job under about a minute
max_upload_mb      = 200
default_channel    = 0

[output]
out_dir           = "runs/infer"   # one folder per job (gitignored)
n_samples         = 4              # [DECISION] new whistles of the same type per detected whistle
max_rendered      = 60             # [DECISION] whistles beyond this get images and numbers but no sound files
contour_threshold = 0.05           # [EXPLICIT] Fig. 2
audio_rate_hz     = 48000          # [DECISION] sonify.py; 96 kHz is used when a tone goes above 0.45 x 48 kHz
high_audio_rate_hz = 96000
clip_margin_s     = 0.05           # [DECISION] recording excerpt: whistle span +/- this
clip_band_margin_hz = 1000.0       # [DECISION] recording excerpt band-passed to [f_min - this, f_max + this]

[generate]
max_n            = 16
weights          = "eq10"          # [DECISION] conditional weights, as Table 3's primary (configs/vaegmm.toml)
max_draws        = 200000          # rejection sampler limit per request
fallback_fc_hz   = 9000.0          # [DECISION] only when the training images.csv files are absent

[server]
host = "127.0.0.1"
port = 8000
# Limits for a page that may be open to the internet (project/AUDIT_2026-11-23.md, BUG-3 to BUG-5)
max_queued          = 6        # [DECISION] jobs waiting behind the running one; more are refused ("busy", 503) instead of queued
max_uploads_at_once = 2        # [DECISION] uploads arriving at the same time (each is stored in a temporary file meanwhile)
max_request_kb      = 64       # [DECISION] largest request other than an upload; the page's JSON requests are under 1 kB
allow_reload        = false    # [DECISION] POST /api/reload-model re-reads every model file; anyone who can open the page could
                               # call it, so it is off. Restart the server after dropping in new files, or set true for local use

[examples]
encounters = [191, 279, 331]   # [DECISION] one short excerpt from each, for visitors without recordings
seconds    = 8.0
rate_hz    = 96000             # [DECISION] excerpts are resampled from 500 kHz; 96 kHz keeps everything up to 48 kHz
