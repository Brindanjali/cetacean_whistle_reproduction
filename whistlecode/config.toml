# =============================================================================
# WhistleCode configuration (see PLAN.md; section numbers below refer to it)
#
# Tags, as in the reproduction's configs:
#   [PLAN]      fixed by PLAN.md
#   [DECISION]  chosen here because nothing fixes it; listed in PLAN.md section 13 where it affects behaviour
#
# Sections are added phase by phase. P0 holds the key streams, framing and error correction only.
# =============================================================================
schema_version = 1

[keys]                       # PLAN 4.1
domain        = "whistlecode/v1"   # [DECISION] prefix hashed into every seed and mask, so other uses of a key never collide
nonce_bytes   = 1                  # [PLAN] one random byte per message, carried in the header
header_streams  = ["scrambler", "timing", "pitch"]                 # [PLAN] seeded from the key only
payload_streams = ["scrambler", "timing", "pitch", "variation"]    # [PLAN] seeded from the key and the nonce
# [DECISION] byte masks (scrambler) come from SHA-256 in counter mode, so they never depend on the NumPy version;
#            continuous draws (timing, pitch, variation) come from NumPy PCG64 generators seeded by SHA-256.

[framing]                    # PLAN 4.2
text_encoding      = "utf-8"       # [PLAN]
min_payload_bytes  = 1             # [DECISION] an empty message has nothing to send
max_payload_bytes  = 140           # [PLAN] k + nsym <= 213 <= 255: one Reed-Solomon codeword, no interleaver
crc                = "CRC-16/CCITT-FALSE"   # [DECISION] poly 0x1021, init 0xFFFF, no reflection, no final XOR ("123456789" -> 0x29B1)
crc_bytes          = 2
bits_per_symbol    = 4             # [PLAN] M = 16 whistle types; E4 may change it later
symbol_order       = "high_nibble_first"    # [PLAN]
n_preamble         = 3             # [PLAN] signature whistles before the header
header_data_bytes  = 2             # [PLAN] payload length + nonce

[fec]                        # PLAN 4.2
library              = "reedsolo"  # [PLAN] approved and installed 2026-11-18
library_version      = "1.7.0"     # [DECISION] pinned; load_config() refuses another version
header_parity        = 4           # [PLAN] RS(6, 2): fixes 2 wrong or 4 erased bytes
payload_parity_min   = 8           # [PLAN] nsym = max(8, ceil(k / 2)), k = payload + CRC bytes
payload_parity_ratio = 0.5         # [PLAN]
erased_fill          = 0           # [DECISION] value written into erased byte positions before decoding (ignored by the decoder)

[schedule]                   # PLAN 4.3 (P1 uses it to space the confusion-pass whistles; the transmitter from P2)
interval_s = [0.55, 0.95]          # [PLAN] start-to-start interval, uniform
start_s    = 0.5                   # [DECISION] first whistle of a test segment
end_margin_s = 0.5                 # [DECISION] the last whistle of a test segment ends this long before the segment's end

[transmit]                   # PLAN 4.4
tau                = 0.5           # [PLAN] latent variation of each whistle; 0 = always the type's mean (final value set by E5)
self_check_redraws = 20            # [PLAN] new latents tried after the first draw, then the type's mean is used
lead_in_s          = 0.5           # [DECISION] silence before the first whistle of a WAV
tail_s             = 0.5           # [DECISION] silence after the last whistle of a WAV
peak_dbfs          = -3.0          # [DECISION] peak level of the WAV; the channel sets the SNR afterwards

[model]                      # PLAN 3 (paths relative to the repository root)
run_dir      = "models/vaegmm/V1_L64_b1e-4_critic_E191"
checkpoint   = "final.pt"          # [PLAN] never last.pt
latents      = "latents_mu.npy"
latents_json = "latents_mu.json"   # records the checkpoint's SHA-256
gmm          = "gmm_K3000/gmm.npz"
gmm_json     = "gmm_K3000/gmm.json"  # records the latents' SHA-256 and n_points
device       = "auto"              # auto | cuda | cpu (VAE and detector)
decode_batch = 256                 # [DECISION] images per VAE decoder call (fits the 8 GB laptop GPU)

[synth]                      # PLAN 4.4
fs_hz            = 96000           # [PLAN]
harmonic2_db     = -12.0           # [PLAN]
taper            = [0.15, 0.3]     # [PLAN] Tukey taper range (the synthetic generator uses 0.15-0.6)
ripple_depth     = [0.0, 0.3]      # [DECISION] as the synthetic generator
ripple_rate_hz   = [1.0, 5.0]      # [DECISION] as the synthetic generator
fc_range_hz      = [5000.0, 12000.0]   # [PLAN] centre frequencies, drawn from the encounter-191 whistles in this range
fc_source_encounter = 191          # [PLAN]
contour_threshold = 0.05           # [PLAN] image -> contour threshold (paper Fig. 2, sonify.py)

[channel]                    # PLAN 6. Built in P1: real noise and narrowband SNR. Multipath, absorption, Doppler: P3
noise_channel   = 0                # [PLAN] hydrophone channel of the noise recordings
noise_cache_dir = "whistlecode/outputs/cache/noise"   # [DECISION] resampled, high-passed noise as float32 .npy (relative to the repo root)
snr_bin_hz      = 93.75            # [PLAN] narrowband SNR per S4 bin
max_snr_db      = 40.0             # [DECISION] cap: the detector missed a whistle about 67 dB above the noise (readiness probe)

[detect]                     # PLAN 7 steps 1 and 4
slot_early_ms   = 60.0             # [PLAN] a track may start this much before the expected time
slot_late_ms    = 150.0            # [PLAN] ... or this much after it
pitch_window_hz = 1500.0           # [PLAN] track centre within this of the expected centre frequency

[classify]                   # PLAN 7 step 5, classifier A
dtw_band_frac   = 0.2              # [DECISION] Sakoe-Chiba band, as a fraction of the longer contour ...
dtw_band_min    = 5                # [DECISION] ... and at least this many frames
# distance = mean |offset difference| along the DTW path + a duration term. [DECISION] measured 2026-11-18 on
# encounter-214 noise at 10 dB (17 types x 40 sends): the detector trims whistle ends (median 21 ms shorter), so a track
# shorter than the template costs little and a longer one costs more. Symmetric 5 Hz/ms gave 2e + f = 0.29 per whistle,
# this asymmetric rule 0.21.
duration_weight_short_hz_per_ms = 0.5   # [DECISION] per ms the track is shorter than the template
duration_weight_long_hz_per_ms  = 2.0   # [DECISION] per ms the track is longer than the template
query_reference = "expected_fc"    # [DECISION] offsets of a detected track are measured from the centre frequency the
                                   # key gives for its slot (the transmitter puts the type's mid-range there), not from
                                   # the track's own mid-range, which moves when the ends are trimmed (correct 59 % -> 79 %)
ambiguity_ratio = 0.85             # [DECISION] erased when best / second-best distance > this; was 0.8 in the plan,
                                   # 0.85 gave the lowest 2e + f in the same measurement (re-tuned on 214 in P5)

[codebook]                   # PLAN 5
min_nk              = 32           # [DECISION] was 65 in the plan: with 65, only 20 of 203 components passed the shape filter on epoch 101
duration_ms         = [100.0, 450.0]   # [DECISION] was 150-450: the mean decodes are short (median 128 ms) and 100 ms whistles were detected at 10 dB
span_hz             = [300.0, 5000.0]  # [PLAN]
max_gap_cols        = 3            # [PLAN]
stability_samples   = 32           # [PLAN] decodes per component for the shape-stability check
stability_quantile  = 0.5          # [PLAN] keep components whose median sample distance is at most this quantile
n_types             = 16           # [PLAN] symbols 0-15, plus one signature whistle
noise_encounter     = 214          # [PLAN]
pass_sends          = 50           # [PLAN] per candidate in the confusion pass
pass_snr_db         = 10.0         # [DECISION] was 5 dB: the detector found almost no whistles at 0-5 dB in the readiness probe
min_detection_rate  = 0.8          # [DECISION] candidates detected less often than this in the pass are dropped
verify_sends        = 200          # [PLAN] per chosen type
verify_max_pair_confusion = 0.02   # [PLAN]
verify_rounds       = 5            # [DECISION] replacement rounds before the build reports a failed verification
out_dir             = "whistlecode/outputs/codebook"   # relative to the repository root
gallery_fc_hz       = 8000.0       # [DECISION] centre frequency of the gallery WAVs
seed                = 20261118     # [DECISION]
