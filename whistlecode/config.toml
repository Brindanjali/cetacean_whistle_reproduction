# =============================================================================
# WhistleCode configuration (see PLAN.md; section numbers below refer to it)
#
# Tags, as in the reproduction's configs:
#   [PLAN]      fixed by PLAN.md
#   [DECISION]  chosen here because nothing fixes it; listed in PLAN.md section 13 where it affects behaviour
#
# Sections are added phase by phase. P0 holds the key streams, framing and error correction only.
# =============================================================================
schema_version = 1

[keys]                       # PLAN 4.1
domain        = "whistlecode/v1"   # [DECISION] prefix hashed into every seed and mask, so other uses of a key never collide
nonce_bytes   = 1                  # [PLAN] one random byte per message, carried in the header
header_streams  = ["scrambler", "timing", "pitch", "position"]                 # [PLAN] seeded from the key only
payload_streams = ["scrambler", "timing", "pitch", "variation", "position"]    # [PLAN] seeded from the key and the nonce
                                   # "position" (format v2) picks where in the rhythm bank a message sits
# [DECISION] byte masks (scrambler) come from SHA-256 in counter mode, so they never depend on the NumPy version;
#            continuous draws (timing, pitch, variation) come from NumPy PCG64 generators seeded by SHA-256.

[framing]                    # PLAN 4.2
text_encoding      = "utf-8"       # [PLAN]
min_payload_bytes  = 1             # [DECISION] an empty message has nothing to send
max_payload_bytes  = 140           # [PLAN] k + nsym <= 213 <= 255: one Reed-Solomon codeword, no interleaver
crc                = "CRC-16/CCITT-FALSE"   # [DECISION] poly 0x1021, init 0xFFFF, no reflection, no final XOR ("123456789" -> 0x29B1)
crc_bytes          = 2
bits_per_symbol    = 4             # [PLAN] M = 16 whistle types; E4 may change it later
symbol_order       = "high_nibble_first"    # [PLAN]
n_preamble         = 3             # [PLAN] signature whistles before the header
header_data_bytes  = 2             # [PLAN] payload length + nonce

[format2]                    # PLAN 4.6, message format v2
alphabet             = "ABCDEFGHIJKLMNOPQRSTUVWXYZ .,?!-"   # [PLAN] 5 bits per character; any other text is sent as raw UTF-8
min_length           = 1           # [DECISION] characters (compact) or bytes (raw)
max_length           = 140         # [PLAN]
header_data_symbols  = 3           # [PLAN] mode, spare, length, nonce = 18 bits
header_parity        = 4           # [PLAN] RS(7, 3) over GF(64): fixes 2 wrong or 4 lost whistles
payload_parity_min   = 8           # [PLAN] parity = max(8, ceil(data symbols / 2)) per block
payload_parity_ratio = 0.5         # [PLAN]
max_block_symbols    = 63          # [PLAN] GF(64): at most 63 symbols per code block
soft_spare_parity    = 2           # [DECISION] retries that mark doubtful whistles as lost leave this many parity symbols unused
soft_max_combinations = 16         # [DECISION] most block repairs checked against the CRC, which keeps false messages rare

[fec]                        # PLAN 4.2
library              = "reedsolo"  # [PLAN] approved and installed 2026-11-18
library_version      = "1.7.0"     # [DECISION] pinned; load_config() refuses another version
header_parity        = 4           # [PLAN] RS(6, 2): fixes 2 wrong or 4 erased bytes
payload_parity_min   = 8           # [PLAN] nsym = max(8, ceil(k / 2)), k = payload + CRC bytes
payload_parity_ratio = 0.5         # [PLAN]
erased_fill          = 0           # [DECISION] value written into erased byte positions before decoding (ignored by the decoder)

[schedule]                   # PLAN 4.3 (P1 uses it to space the confusion-pass whistles; the transmitter from P2)
interval_s = [0.55, 0.95]          # [PLAN] start-to-start interval, uniform
start_s    = 0.5                   # [DECISION] first whistle of a test segment
end_margin_s = 0.5                 # [DECISION] the last whistle of a test segment ends this long before the segment's end

[transmit]                   # PLAN 4.4
tau                = 0.5           # [PLAN] latent variation of each whistle; 0 = always the type's mean (final value set by E5)
self_check_redraws = 20            # [PLAN] new latents tried after the first draw, then the type's mean is used
lead_in_s          = 0.5           # [DECISION] silence before the first whistle of a WAV
tail_s             = 0.5           # [DECISION] silence after the last whistle of a WAV
peak_dbfs          = -3.0          # [DECISION] peak level of the WAV; the channel sets the SNR afterwards

[bank]                       # PLAN 4.6, the rhythm bank of real whistle times, lengths, pitches and contours
encounters         = [191, 214]    # [PLAN] encounter 276 stays out as the unseen real reference
window_s           = 44.0          # [PLAN] a stretch counts as active with at least min_whistles in this window
min_whistles       = 10            # [PLAN]
min_silence_s      = 1.0           # [PLAN] messages start and stop only at a real silence this long
data_length_s      = [0.10, 0.45]  # [PLAN] a real whistle of this length can carry data
slot_early_s       = 0.06          # [PLAN] no other whistle may start this long before a data whistle ...
slot_late_s        = 0.15          # [PLAN] ... or this long after it
min_data_spacing_s = 0.35          # [PLAN] data whistles start at least max(this, real length + data_after_s) apart
data_after_s       = 0.10          # [PLAN]
max_join_gap_s     = 3.0           # [DECISION] longest silence left where two stretches of the bank are joined
out_dir            = "whistlecode/outputs/bank"   # relative to the repository root
sha256             = "27ca3ddeadd21abbcd8fbcdf88ac3623183608b470b22d0bc66153de1a0f717f"   # [PLAN] sender and receiver must hold this exact bank

[sender]                     # PLAN 4.6, format v2 transmitter
data_amplitude          = 0.05     # [DECISION] fundamental of a data whistle in the WAV, so the channel can set the SNR from the WAV alone
cover_extra_db          = [0.0, 10.0]   # [DECISION] cover whistles are as loud as the data whistles, or up to 10 dB louder (as in gate F1)
collision_hz            = 1000.0   # [PLAN] a cover whistle this close in pitch to a data whistle moves
follow_s                = 0.10     # [PLAN] ... also when it starts this soon after that data whistle ends
cover_move_clearance_hz = 1500.0   # [DECISION] a moved cover whistle keeps this far from the data whistles it overlaps
cover_pitch_range_hz    = [3000.0, 17000.0]   # [DECISION] where moved cover whistles may go
cover_move_tries        = 30       # [DECISION]

[realism]                    # the sender's realism upgrade; the receiver and the message format do not depend on it
enabled               = true       # false = the plain sender (VAE shapes, one fixed voice, no clicks)
out_dir               = "whistlecode/outputs/realism"   # relative to the repository root; built by build-realism
workers               = 8          # [DECISION] recordings read at once
# real shapes: real whistles of each codebook type's GMM cluster
real_shapes           = false      # [DECISION] true = data whistles take the shape of a real whistle of their type. Measured 2026-11-19: real shapes decoded 76 of 90 messages (pass mark 77), realism score 0.920; VAE shapes 82 of 90, score 0.954
min_observed_fraction = 0.9       # [DECISION] the tracker saw at least this share of the whistle's frames
shape_margin          = 0.7        # [DECISION] classifier A's closest / second-closest distance must be below this
min_members           = 8          # [DECISION] with fewer real shapes than this, the type keeps its VAE shapes
# real voices: loudness patterns and harmonics of clean recorded whistles
voice_min_snr_db      = 20.0       # [DECISION] median level of the whistle above the noise in its frequency bin
voice_frame_snr_db    = 10.0       # [DECISION] at least 90 % of its frames reach this level
voice_max_hz          = 15000.0    # [DECISION] so that the 2nd and 3rd harmonics can be measured below 48 kHz
max_voices            = 4000       # [DECISION]
steady_floor_db       = -9.0       # [DECISION] data whistles use voices that stay above this level through their middle 80 %
max_h2_db             = -3.0       # [DECISION] voices with a stronger 2nd harmonic are skipped: the detector could follow it instead
edge_fade_ms          = 5.0        # [DECISION] fade at each end of a whistle, so it never starts with a pop
# virtual animals
n_animals             = 6          # [DECISION]
level_range_db        = [0.0, 10.0]   # [DECISION] above data_amplitude, the same range for data and cover whistles
median_level_db       = 5.0        # [DECISION] the channel's SNR refers to this level, and no data whistle is quieter than it
level_jitter_db       = 1.5        # [DECISION] whistle-to-whistle change in one animal's level
animal_stay           = 0.6        # [DECISION] chance that the next whistle comes from the same animal
tone_range_db         = [0.0, 6.0] # [DECISION] extra loss per harmonic, as for an animal further away
# recorded clicks
click_min_snr_db      = 20.0       # [DECISION] peak above the level just before and after the click
click_min_crest       = 3.0        # [DECISION] peak / RMS of the 2 ms cut: rejects tones and long knocks
click_train_min       = 5          # [DECISION] clicks in a regular train; isolated sharp sounds are skipped
click_ici_s           = [0.002, 0.25]  # [DECISION] time between clicks of a train
click_ici_ratio       = 2.0        # [DECISION] neighbouring intervals of a train differ by less than this factor
click_guard_ms        = 12.0       # [DECISION] clicks this close to a data whistle are left out
click_peak_max        = 0.3        # [DECISION] loudest click in the WAV

[receiver]                   # PLAN 7, format v2 receiver
pitch_window_hz     = 500.0        # [PLAN] a track further than this from every candidate pitch is not a match
sync_bin_s          = 0.02         # [DECISION] resolution of the search for the frame's start
sync_tolerance_s    = 0.06         # [DECISION] a track this close to a known whistle time counts as matching it
sync_preamble_weight = 3.0         # [DECISION] the three signature whistles count more than cover whistles
sync_candidates     = 8            # [DECISION] frame starts tried, best first, until the CRC passes
slot_guard_ms       = 0.0          # [DECISION] track frames this long before the slot's time still count as the whistle (0, 4 and 8 ms read equally well)
slot_tail_ms        = 8.0          # [DECISION] ... and this long after the end of the shape being tried
min_overlap_ms      = 20.0         # [DECISION] a track must reach this far past the slot's time to be read
min_track_frames    = 4            # [DECISION] fewest track frames a shape is compared with
missing_weight_hz_per_ms = 0.5     # [DECISION] cost per ms of the shape that the track does not cover
extra_weight_hz_per_ms   = 1.0     # [DECISION] cost per ms the track runs on after the shape should have ended (measured on encounter-214 noise, 2026-11-19)
soft_repair         = true         # [DECISION] retry failed repairs with the most doubtful whistles marked as lost
max_header_readings = 3            # [DECISION] valid header readings tried per frame start
silence_fraction    = 0.01         # [DECISION] a recording with at least this share of exactly-zero samples is digital silence (a file straight from the sender)
silence_floor_snr_db = 40.0        # [PLAN] E1: such a recording first gets white noise this far under its loud whistles; the detector misses whistles in pure silence
silence_floor_seed  = 0            # [DECISION] fixed, so one file always gives the same tracks
# Drift correction (WC-R2, PLAN 7 step 4 and 8.7): a closing speed v heard at time scale s = 1 + v / c, or two sound cards whose
# clocks differ, moves late whistles out of their slot windows. Developed on encounter-214 noise only (experiments/drift_dev.py).
drift_correction    = true         # [DECISION] estimate the time scale and read the payload on the sender's clock
drift_max           = 0.0025       # [DECISION] time scales searched: 1 +/- this (+/- 3.75 m/s at 1,500 m/s; sound cards differ by about 0.01 %)
drift_sync_step     = 0.00025      # [DECISION] grid step of the frame search (10 ms over a 40 s start signal and header)
drift_sync_sigma_s  = 0.02         # [DECISION] width of the score that picks the frame search's time scale among equal votes
drift_fine_step     = 0.00002      # [DECISION] grid step of the whole-message search (5 ms over 250 s), before the least-squares fit
drift_fit_tolerance_s = 0.04       # [DECISION] whistles this close to the grid search's line enter the least-squares fit
drift_min_matches   = 8            # [DECISION] fewer matched whistles than this: keep the frame search's start and time scale

[model]                      # PLAN 3 (paths relative to the repository root)
run_dir      = "models/vaegmm/V1_L64_b1e-4_critic_E191"
checkpoint   = "final.pt"          # [PLAN] never last.pt
latents      = "latents_mu.npy"
latents_json = "latents_mu.json"   # records the checkpoint's SHA-256
gmm          = "gmm_K3000/gmm.npz"
gmm_json     = "gmm_K3000/gmm.json"  # records the latents' SHA-256 and n_points
device       = "auto"              # auto | cuda | cpu (VAE and detector)
decode_batch = 256                 # [DECISION] images per VAE decoder call (fits the 8 GB laptop GPU)

[synth]                      # PLAN 4.4
fs_hz            = 96000           # [PLAN]
harmonic2_db     = -12.0           # [PLAN]
taper            = [0.15, 0.3]     # [PLAN] Tukey taper range (the synthetic generator uses 0.15-0.6)
ripple_depth     = [0.0, 0.3]      # [DECISION] as the synthetic generator
ripple_rate_hz   = [1.0, 5.0]      # [DECISION] as the synthetic generator
fc_range_hz      = [5000.0, 12000.0]   # [PLAN] centre frequencies, drawn from the encounter-191 whistles in this range
fc_source_encounter = 191          # [PLAN]
contour_threshold = 0.05           # [PLAN] image -> contour threshold (paper Fig. 2, sonify.py)

[sea]                        # PLAN 6: echoes, absorption and Doppler between the sender and the hydrophone (wcode/sea.py)
sound_speed_mps    = 1500.0        # [PLAN]
surface_reflection = -0.9          # [PLAN]
bottom_reflection  = 0.4           # [PLAN]
ranges_km          = [0.2, 0.5, 1.0, 2.0]   # [PLAN] one is drawn per message
water_depth_m      = [50.0, 1000.0]    # [PLAN] [DECISION] drawn evenly on a log scale, so shallow and deep water count alike
source_depth_m     = [5.0, 30.0]   # [PLAN]
receiver_depth_m   = [5.0, 50.0]   # [PLAN]
max_speed_mps      = 3.0           # [PLAN] the closing speed is drawn evenly from -3 to +3 m/s
tail_guard_s       = 0.05          # [DECISION] silence kept after the last echo
doppler_max_denominator = 20000    # [DECISION] the time scale is an exact ratio with at most this denominator
doppler_kaiser_beta     = 8.0      # [DECISION] resampling filter of the Doppler time-scaling

[channel]                    # PLAN 6: real noise and narrowband SNR
noise_channel   = 0                # [PLAN] hydrophone channel of the noise recordings
noise_cache_dir = "whistlecode/outputs/cache/noise"   # [DECISION] resampled, high-passed noise as float32 .npy (relative to the repo root)
snr_bin_hz      = 93.75            # [PLAN] narrowband SNR per S4 bin
max_snr_db      = 40.0             # [DECISION] cap: the detector missed a whistle about 67 dB above the noise (readiness probe)
noise_encounter = 214              # [PLAN] tuning noise; encounter 276 is kept for the final test, and 191 is never noise
pad_s           = 2.0              # [DECISION] noise added around the message; the message starts at a random time inside it
level_window_s  = 60.0             # [DECISION] noise used to measure the level the SNR refers to

[detect]                     # PLAN 7 steps 1 and 4
slot_early_ms   = 60.0             # [PLAN] a track may start this much before the expected time
slot_late_ms    = 150.0            # [PLAN] ... or this much after it
pitch_window_hz = 1500.0           # [PLAN] track centre within this of the expected centre frequency

[classify]                   # PLAN 7 step 5, classifier A
dtw_band_frac   = 0.2              # [DECISION] Sakoe-Chiba band, as a fraction of the longer contour ...
dtw_band_min    = 5                # [DECISION] ... and at least this many frames
# distance = mean |offset difference| along the DTW path + a duration term. [DECISION] measured 2026-11-18 on
# encounter-214 noise at 10 dB (17 types x 40 sends): the detector trims whistle ends (median 21 ms shorter), so a track
# shorter than the template costs little and a longer one costs more. Symmetric 5 Hz/ms gave 2e + f = 0.29 per whistle,
# this asymmetric rule 0.21.
duration_weight_short_hz_per_ms = 0.5   # [DECISION] per ms the track is shorter than the template
duration_weight_long_hz_per_ms  = 2.0   # [DECISION] per ms the track is longer than the template
query_reference = "expected_fc"    # [DECISION] offsets of a detected track are measured from the centre frequency the
                                   # key gives for its slot (the transmitter puts the type's mid-range there), not from
                                   # the track's own mid-range, which moves when the ends are trimmed (correct 59 % -> 79 %)
ambiguity_ratio = 0.85             # [DECISION] erased when best / second-best distance > this; was 0.8 in the plan,
                                   # 0.85 gave the lowest 2e + f in the same measurement (re-tuned on 214 in P5)

[codebook]                   # PLAN 5
min_nk              = 32           # [DECISION] was 65 in the plan: with 65, only 20 of 203 components passed the shape filter on epoch 101
duration_ms         = [100.0, 450.0]   # [DECISION] was 150-450: the mean decodes are short (median 128 ms) and 100 ms whistles were detected at 10 dB
span_hz             = [300.0, 5000.0]  # [PLAN]
max_gap_cols        = 3            # [PLAN]
stability_samples   = 32           # [PLAN] decodes per component for the shape-stability check
stability_quantile  = 0.5          # [PLAN] keep components whose median sample distance is at most this quantile
n_types             = 16           # [PLAN] symbols 0-15, plus one signature whistle
noise_encounter     = 214          # [PLAN]
pass_sends          = 50           # [PLAN] per candidate in the confusion pass
pass_snr_db         = 10.0         # [DECISION] was 5 dB: the detector found almost no whistles at 0-5 dB in the readiness probe
min_detection_rate  = 0.8          # [DECISION] candidates detected less often than this in the pass are dropped
verify_sends        = 200          # [PLAN] per chosen type
verify_max_pair_confusion = 0.02   # [PLAN]
verify_rounds       = 5            # [DECISION] replacement rounds before the build reports a failed verification
out_dir             = "whistlecode/outputs/codebook"   # relative to the repository root
gallery_fc_hz       = 8000.0       # [DECISION] centre frequency of the gallery WAVs
seed                = 20261118     # [DECISION]

[web]                        # 05 · Encode and 06 · Decode on the project page (wcode/web.py, web/message.js)
out_dir           = "whistlecode/outputs/web"   # one folder per job, relative to the repository root
keep_jobs         = 60             # [DECISION] newest job folders kept
max_chars         = 60             # [DECISION] about 160 s of sound; longer messages make the visitor wait minutes
max_key_chars     = 64             # [DECISION]
max_upload_mb     = 200            # [DECISION] 300 s of 96 kHz float32 audio is 115 MB
max_seconds       = 300.0          # [DECISION] longest recording the decoder takes
min_rate_hz       = 32000          # [DECISION] as Try it: the whistles reach 14.5 kHz
max_rate_hz       = 192000         # [DECISION] the detector works at 192 kHz; with max_seconds it bounds the memory one upload needs
max_channels      = 8              # [DECISION] only the first channel is read (whistlepipe/guard.py read_channel)
max_queued        = 6              # [DECISION] jobs waiting behind the running one; more are refused ("busy", 503) instead of queued
max_uploads_at_once = 2            # [DECISION] uploads arriving at the same time (each is stored in a temporary file meanwhile)
max_request_kb    = 64             # [DECISION] largest request other than an upload; the page's JSON requests are under 1 kB
formats           = [".wav", ".flac", ".ogg"]   # [DECISION] read by soundfile; lossy MP3 is left out
snr_choices_db    = [10.0, 15.0, 20.0]   # [DECISION] the levels the pipeline was tested at
noise_choices     = [276, 214]     # [DECISION] 276 first: the receiver was never tuned on it
picture_hz        = [1000.0, 20000.0]    # [DECISION] frequency range of the page's spectrograms
picture_rows      = 200            # [DECISION]
picture_cols_per_s = 100           # [DECISION] at most; fewer for long recordings, so a picture stays under 30,000 columns
picture_range_db  = 50.0           # [DECISION] darkest = the loudest 0.05 % of the picture, palest = at most 50 dB below it
picture_floor_db  = 2.0            # [DECISION] ... and at least this far above the median level, so the noise floor of a sea recording is pale
play_fs_hz        = 48000          # [DECISION] the page plays a 16-bit 48 kHz copy; decoding and downloads use the original
play_peak         = 0.89           # [DECISION] the copy is scaled to this peak
tls_dir           = "whistlecode/outputs/web_tls"   # serve --lan: the self-signed certificate and its key (never committed)
tls_days          = 365            # [DECISION] how long the certificate lasts
