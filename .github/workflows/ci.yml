# Continuous integration (project/ENGINEERING.md#ci): on every push to main and every pull request.
# It sees only what git holds, so tests that need the local dataset or model files skip themselves (marker localdata).
# Failing tests and audit findings are posted as annotations on the run, which anyone can read without signing in
# (the logs need a sign-in): python tools/repo.py ci-report reads them back.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MPLBACKEND: Agg

jobs:
  checks:
    name: Lint, secrets, links, checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                 # the secret scan reads every commit
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install ruff (the version in constraints.txt)
        run: pip install "$(grep -E '^ruff==' constraints.txt)"
      - name: Lint
        run: ruff check --output-format github .
      - name: Secrets (files and history), links, checksums of the tracked models
        run: |
          python tools/repo.py check secrets links checksums
          python tools/repo.py secrets --history

  tests:
    name: Tests (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            whistlecode/requirements.txt
            constraints.txt
      - name: Install (CPU PyTorch, then the pinned requirements)
        run: |
          TORCH=$(grep -E '^torch==' constraints.txt | cut -d= -f3)
          TV=$(grep -E '^torchvision==' constraints.txt | cut -d= -f3)
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==$TORCH" "torchvision==$TV"
          pip install -r requirements.txt -r whistlecode/requirements.txt -c constraints.txt
          pip install pytest-github-actions-annotate-failures==0.2.0   # each failing test becomes an annotation
      - name: Configs (every loader accepts its file)
        run: python tools/repo.py check config
      - name: Whistle-model suite
        run: python -m pytest -rs
      - name: Message-system suite
        run: python -m pytest whistlecode/tests -rs

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install pip-audit
      - name: Audit the server image's pins and the lock file (findings become warnings; the job fails only if the audit cannot run)
        run: |
          pip-audit --no-deps --disable-pip -r deploy/requirements-serve.txt -r constraints.txt -f json -o audit.json || true
          python tools/repo.py audit-report audit.json
